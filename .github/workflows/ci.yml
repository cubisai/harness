name: CI

on:
  push:
  pull_request:

# No provider, Gemini or Antigravity credential is ever a CI secret: every test
# talks to a local fake endpoint or a mock agent. Jobs set only the variables in
# this env block plus UNSKILLED_CODEX_BIN (test/ci-workflow.test.ts enforces it).
env:
  UNSKILLED_NO_UPDATE: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  codex-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun add -g @openai/codex
      - run: echo "UNSKILLED_CODEX_BIN=$(which codex)" >> "$GITHUB_ENV"
      - run: bun run test codex-e2e

  smoke:
    # The packaged app, after the test matrix: window, preload bridge, browser,
    # terminal, provider registry, legacy migration, handoff and render parity.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx electron-builder --dir --publish never
      - run: xvfb-run -a node scripts/smoke.mjs
