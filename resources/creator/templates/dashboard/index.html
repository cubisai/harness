<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px 16px 20px; }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 14px; font-weight: 600; margin: 0; flex: 1; }
  select { font: inherit; font-size: 12px; color: var(--cq-text); background: var(--cq-bg-subtle); border: 1px solid var(--cq-hairline-strong); border-radius: 6px; padding: 3px 6px; }
  select:focus-visible, button:focus-visible { outline: 2px solid var(--cq-focus); outline-offset: 2px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .stat { border: 1px solid var(--cq-hairline); border-radius: 8px; padding: 9px 10px; }
  .stat .label { font-size: 11px; color: var(--cq-text-secondary); }
  .stat .value { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat .delta { font-size: 11px; color: var(--cq-text-tertiary); font-variant-numeric: tabular-nums; }
  .stat .delta.up { color: var(--cq-success); }
  .stat .delta.down { color: var(--cq-danger); }
  h2 { font-size: 12px; font-weight: 500; color: var(--cq-text-secondary); margin: 0 0 6px; }
  .chart { border: 1px solid var(--cq-hairline); border-radius: 8px; padding: 10px 10px 4px; margin-bottom: 14px; }
  .chart svg { display: block; width: 100%; height: 140px; }
  .chart rect { fill: var(--cq-text); opacity: .85; }
  .chart rect:hover { opacity: 1; fill: var(--cq-signal-ink); }
  .axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--cq-text-tertiary); padding: 4px 0 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 500; color: var(--cq-text-secondary); border-bottom: 1px solid var(--cq-hairline); padding: 5px 4px; }
  td { border-bottom: 1px solid var(--cq-hairline); padding: 6px 4px; }
  th.num, td.num { text-align: right; }
  .note { font-size: 12px; color: var(--cq-text-secondary); padding: 24px 0; text-align: center; }
  .note.error { color: var(--cq-danger); }
  button.retry { font: inherit; font-size: 12px; margin-left: 6px; background: none; border: 1px solid var(--cq-hairline-strong); border-radius: 6px; color: var(--cq-text); padding: 2px 8px; cursor: pointer; }
</style>
</head>
<body>
  <header>
    <h1>Sales</h1>
    <select id="range" aria-label="Period">
      <option value="7">Last 7 days</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
    </select>
  </header>
  <main id="main"><div class="note">Loading…</div></main>
  <script src="app.js"></script>
</body>
</html>
