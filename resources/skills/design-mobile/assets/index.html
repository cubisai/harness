<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile screens</title>
  <link rel="stylesheet" href="system/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--color-surface-2);
      color: var(--color-text);
      font-family: var(--font-sans);
      font-size: var(--text-md);
      line-height: var(--leading-md);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, p { margin: 0; }
    button, input { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

    /* The backdrop: frames in a wrapping row. */
    .board { display: flex; flex-wrap: wrap; gap: var(--space-12); padding: var(--space-12); align-items: flex-start; }
    .frame { display: flex; flex-direction: column; gap: var(--space-4); }
    .caption { font-size: var(--text-sm); line-height: var(--leading-sm); color: var(--color-text-muted); text-align: center; }

    /* One phone: 390x844 with status bar (47) and home indicator (34). */
    .phone {
      position: relative;
      width: 390px;
      height: 844px;
      overflow: hidden;
      border-radius: 48px;
      background: var(--color-bg);
      box-shadow: 0 0 0 8px var(--color-text), var(--shadow-3);
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      flex: 0 0 47px;
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 var(--space-8) var(--space-2);
      font-size: var(--text-sm); line-height: var(--leading-sm); font-weight: var(--weight-bold);
    }
    .screen { flex: 1; overflow-y: auto; padding: 0 var(--space-4) var(--space-4); }
    .tab-bar {
      flex: 0 0 49px;
      display: flex; justify-content: space-around; align-items: center;
      border-top: 1px solid var(--color-border);
      background: var(--color-surface);
      font-size: var(--text-xs); line-height: var(--leading-xs);
    }
    .home-indicator { flex: 0 0 34px; display: flex; align-items: center; justify-content: center; background: inherit; }
    .home-indicator::after { content: ""; width: 134px; height: 5px; border-radius: var(--radius-full); background: var(--color-text); }

    /* Build the screens below. Tokens only; targets >= 44px. */
  </style>
</head>
<body>
  <div class="board">
    <div class="frame">
      <section class="phone" id="home" aria-label="Home">
        <div class="status-bar"><span>9:41</span><span aria-hidden="true">●●● ▮</span></div>
        <div class="screen">
        </div>
        <nav class="tab-bar" aria-label="Tabs"></nav>
        <div class="home-indicator"></div>
      </section>
      <p class="caption">1 · Home</p>
    </div>
  </div>
</body>
</html>
