<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototype</title>
  <link rel="stylesheet" href="system/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      font-size: var(--text-md);
      line-height: var(--leading-md);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, p { margin: 0; }
    img, svg { display: block; max-width: 100%; }
    button, input, select, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
    .container { max-width: var(--content-max); margin-inline: auto; padding-inline: var(--space-6); }
    @media (max-width: 767px) { .container { padding-inline: var(--space-4); } }

    /* Build the design below. Tokens only: --color-*, --text-*/--leading-*, --space-*, --radius-*, --shadow-*. */
  </style>
</head>
