<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck</title>
  <link rel="stylesheet" href="system/tokens.css">
  <link rel="stylesheet" href="system/ui.css">
  <link rel="stylesheet" href="deck.css">
  <style>
    /* Slide type: slides are 1920x1080, so sizes are about 2x the screen scale. Kit parts are left alone (a kit's slide part scales them). */
    .slide h1:not([data-ui]) { font-family: var(--font-display); font-size: 96px; line-height: 104px; font-weight: var(--weight-bold); }
    .slide h2:not([data-ui]) { font-family: var(--font-display); font-size: 64px; line-height: 72px; font-weight: var(--weight-bold); }
    .slide :is(p, li):not([data-ui], [data-ui] *) { font-size: 40px; line-height: 56px; }
    .slide .muted { color: var(--color-text-muted); }

    /* Build the slides below. Tokens for color, radius and the 8pt spacing scale. */
  </style>
</head>
<body>
  <main class="deck">
    <section class="slide" aria-label="Title">
      <h1>Deck title</h1>
      <p class="muted">Subtitle</p>
    </section>
  </main>
  <script src="system/ui.js"></script>
  <script src="deck.js"></script>
</body>
</html>
