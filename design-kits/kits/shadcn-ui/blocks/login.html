<section data-ui="login">
  <div data-ui="card">
    <div data-part="header">
      <h1 data-part="title">Sign in to Tallybook</h1>
      <p data-part="description">Your invoices and clients are waiting on the other side.</p>
    </div>
    <div data-part="content">
      <div data-ui="stack" data-gap="md">
        <div data-ui="field">
          <label data-part="label" for="tb-login-email">Email</label>
          <input data-ui="input" id="tb-login-email" type="email" placeholder="you@studio.com" autocomplete="email">
        </div>
        <div data-ui="field">
          <label data-part="label" for="tb-login-password">Password</label>
          <input data-ui="input" id="tb-login-password" type="password" placeholder="Your password" autocomplete="current-password">
        </div>
        <div data-ui="stack" data-part="links" data-direction="row" data-gap="sm" data-align="center" data-justify="between">
          <label data-ui="checkbox" for="tb-login-remember">
            <input type="checkbox" id="tb-login-remember">
            <span>Keep me signed in</span>
          </label>
          <a data-ui="button" data-variant="link" href="#">Forgot password?</a>
        </div>
        <button data-ui="button">Sign in</button>
        <div data-part="or">or</div>
        <button data-ui="button" data-variant="outline">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-1-2.6c3.1-.3 6.4-1.5 6.4-7A5.4 5.4 0 0 0 20 4.8 5 5 0 0 0 19.9 1S18.6.6 16 2.4a13.4 13.4 0 0 0-7 0C6.4.6 5.1 1 5.1 1A5 5 0 0 0 5 4.8a5.4 5.4 0 0 0-1.5 3.7c0 5.5 3.3 6.7 6.4 7a3.4 3.4 0 0 0-1 2.6V22"/></svg>
          Continue with GitHub
        </button>
      </div>
    </div>
    <div data-part="footer">
      <p data-ui="text" data-size="sm" data-tone="muted">New to Tallybook? <a data-ui="button" data-variant="link" href="#">Create an account</a></p>
    </div>
  </div>
</section>
